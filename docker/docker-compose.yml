services:

  # ===================== Orchestrator + Sub-agent FastAPI services =====================
  # All 7 services share one image (docker/app/Dockerfile); only the uvicorn
  # module path and port differ per service, same as mini_rag's single-image
  # pattern where fastapi/celery-worker/celery-beat/flower reuse one build.

  agents-service:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agents-service
    ports:
      - "8000:8000"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agents-service.main:app", "--host", "0.0.0.0", "--port", "8000"]

  agent-property:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-property
    ports:
      - "8001:8001"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent1-service-property.main:app", "--host", "0.0.0.0", "--port", "8001"]

  agent-hr:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-hr
    ports:
      - "8002:8002"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent2-service-HR.main:app", "--host", "0.0.0.0", "--port", "8002"]

  agent-crm:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-crm
    ports:
      - "8003:8003"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent3-service-CRM.main:app", "--host", "0.0.0.0", "--port", "8003"]

  agent-deals:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-deals
    ports:
      - "8004:8004"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent4-service-deals.main:app", "--host", "0.0.0.0", "--port", "8004"]

  agent-sales:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-sales
    ports:
      - "8006:8006"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent5-service-sales.main:app", "--host", "0.0.0.0", "--port", "8006"]

  agent-payment:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: agent-payment
    ports:
      - "8007:8007"
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      pgvector:
        condition: service_healthy
    command: ["uvicorn", "agent6-service-payment.main:app", "--host", "0.0.0.0", "--port", "8007"]

  # ===================== Celery Worker =====================
  # One worker consuming every service's queue, mirroring mini_rag's single
  # celery-worker container consuming multiple queues.
  celery-worker:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: celery-worker
    env_file:
      - ./env/.env.app
    networks:
      - backend
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    command: ["python", "-m", "celery", "-A", "celery_app", "worker",
              "--queues=default,orchestrator_queue,property_queue,hr_queue,crm_queue,deals_queue,sales_queue,payment_queue",
              "--loglevel=info", "--pool=threads", "--concurrency=4"]

  # ===================== Flower Dashboard =====================
  flower:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: flower
    env_file:
      - ./env/.env.app
    ports:
      - "5555:5555"
    networks:
      - backend
    restart: always
    depends_on:
      - rabbitmq
      - celery-worker
    command: ["python", "-m", "celery", "-A", "celery_app", "flower", "--conf=flowerconfig.py"]

  # ===================== Nginx (routes to the orchestrator) =====================
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - agents-service
    networks:
      - backend
    restart: always

  # ===================== PostgreSQL (pgvector, self-hosted) =====================
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    ports:
      - "5400:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================== Prometheus Monitoring =====================
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # ===================== Grafana Dashboard =====================
  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

  # ===================== Node Exporter =====================
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend
    restart: always

  # ===================== Postgres Exporter =====================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always

  # ===================== RabbitMQ (Celery broker) =====================
  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    env_file:
      - ./env/.env.rabbitmq
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 10s
      retries: 5

  # ===================== Redis (Celery result backend) =====================
  redis:
    image: redis:8.0.3-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./env/.env.redis
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ChangeMe}"]

networks:
  backend:
    driver: bridge

volumes:
  pgvector_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  redis_data:
