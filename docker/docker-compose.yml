# Compose for the src/ application.
#
# Two differences from the previous file are deliberate and both matter:
#
# 1. Per-service PG_USER/PG_PASSWORD. Every service used to share one
#    env_file, and therefore one database user, which is why the roles in
#    postgres/least_privilege_roles.sql were written but could never be
#    applied. `environment:` merges over `env_file:`, so each agent now
#    connects as its own role while sharing the rest of the config.
#
# 2. Nothing is published to the host except nginx. Postgres, Redis,
#    Prometheus, Grafana and the exporters were all reachable from
#    outside the machine before, and agents-service was published on
#    8000, which let a caller skip nginx entirely. `expose:` keeps a port
#    reachable inside the compose network and nowhere else.

x-app: &app
  build:
    context: ..
    dockerfile: docker/app/Dockerfile
  env_file:
    - ./env/.env.app
  networks:
    - backend
  restart: always
  depends_on:
    pgvector:
      condition: service_healthy
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:

  # ===================== Orchestrator =====================
  # Reaches data only by delegating. Its role needs no SELECT grant on
  # any business table.
  orchestrator:
    <<: *app
    container_name: orchestrator
    expose:
      - "8000"
    environment:
      AGENT_ROLE: orchestrator
      PG_USER: app_orchestrator
      PG_PASSWORD: ${ORCHESTRATOR_PG_PASSWORD:?set ORCHESTRATOR_PG_PASSWORD}
      SUB_AGENT_URLS: '["hr=http://agent-hr:8002","crm=http://agent-crm:8003"]'
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===================== Sub-agents =====================
  agent-hr:
    <<: *app
    container_name: agent-hr
    expose:
      - "8002"
    environment:
      AGENT_ROLE: sub_agent
      AGENT_DOMAIN: hr
      PG_USER: app_hr
      PG_PASSWORD: ${HR_PG_PASSWORD:?set HR_PG_PASSWORD}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]

  agent-crm:
    <<: *app
    container_name: agent-crm
    expose:
      - "8003"
    environment:
      AGENT_ROLE: sub_agent
      AGENT_DOMAIN: crm
      PG_USER: app_crm
      PG_PASSWORD: ${CRM_PG_PASSWORD:?set CRM_PG_PASSWORD}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003"]

  # ===================== Nginx =====================
  # The only service published to the host.
  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orchestrator
    networks:
      - backend
    restart: always

  # ===================== PostgreSQL (pgvector) =====================
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    expose:
      - "5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./postgres/least_privilege_roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================== Redis =====================
  redis:
    image: redis:8.0.3-alpine
    container_name: redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    # No default password: an unset variable must stop the container,
    # not silently start one with a password that is public knowledge.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]

  # ===================== Monitoring =====================
  # Bound to loopback: reachable from the host that runs the stack, not
  # from the network. Put them behind an authenticating proxy before
  # exposing them anywhere else.
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

networks:
  backend:
    driver: bridge

volumes:
  pgvector_data:
  prometheus_data:
  grafana_data:
  redis_data:
