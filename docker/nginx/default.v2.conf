server {
    listen 80;
    server_name _;

    # Terminate TLS here before this reaches anything real. Sensitive
    # data over plain HTTP is only acceptable on a local machine.
    #   listen 443 ssl;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 1m;

    # A question can take a while to answer.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Principal is set by the authenticating layer, never by the
        # caller. Clearing it here means a client cannot claim an
        # identity by sending the header itself.
        proxy_set_header X-Principal "";

        # Streaming responses must not be buffered.
        proxy_buffering off;
    }

    # Metrics are for Prometheus, which reaches the app directly on the
    # compose network. There is no reason to expose them at the edge.
    location /TjgR_87vhp_bs8KJ {
        return 404;
    }
}
