server {
    listen 80;
    server_name localhost;

    # Entry point routes to the orchestrator (agents-service)
    location / {
        proxy_pass http://agents-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optionally expose metrics endpoint directly
    location /TjgR_87vhp_bs8KJ {
        proxy_pass http://agents-service:8000/TjgR_87vhp_bs8KJ;
    }
}
