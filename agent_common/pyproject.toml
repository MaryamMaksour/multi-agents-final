[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-common"
version = "0.1.0"
description = "Shared FastAPI/LangGraph scaffolding for the multi-agent sub-agent services"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "langchain-core",
    "langgraph",
    "sqlglot",
]

[tool.setuptools.packages.find]
where = ["src"]
